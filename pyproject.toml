[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = [
    "*.ipynb",
    "src/data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.black]
line-length = 79
target-version = ["py310"]
