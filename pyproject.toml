# Purpose: Central Ruff configuration for source formatting and static checks.
# Distinction: Unlike .flake8, this is the authoritative modern tool config.
[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = [
    "*.ipynb",
    "src/data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E203"]
